name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    name: Build Clean APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Replace Project With Clean Version
        run: |
          rm -rf app
          rm -rf gradle
          rm -f build.gradle.kts
          rm -f settings.gradle.kts
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat
          rm -f "Gradle Wrapper Properties File"

          mkdir clean-project
          unzip -q CardClash-CLEANED.zip -d clean-project

          cp -r clean-project/app .
          cp -r clean-project/gradle .
          cp clean-project/build.gradle.kts .
          cp clean-project/settings.gradle.kts .
          cp clean-project/gradle.properties .

          rm -rf clean-project

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CardClash-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
